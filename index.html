<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title> Non Working Saturday Calendar</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

:root{

    --bg:#0f172a;
    --card:#ffffff;
    --primary:#2563eb;
    --primary-dark:#1d4ed8;
    --green:#22c55e;
    --red:#ef4444;
    --text:#111827;
    --muted:#6b7280;
    --border:#e5e7eb;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:'Inter',sans-serif;
    background:
        radial-gradient(circle at top left,#1e293b,#0f172a);
    min-height:100vh;
    color:white;
}

/* HEADER */

.topbar{

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:28px 40px;

    backdrop-filter:blur(20px);

    background:rgba(15,23,42,0.65);

    border-bottom:1px solid rgba(255,255,255,0.08);

    position:sticky;
    top:0;
    z-index:999;
}

.logo{

    font-size:34px;
    font-weight:800;
    letter-spacing:-1px;
}

.controls{

    display:flex;
    align-items:center;
    gap:18px;
}

.nav-btn{

    border:none;
    background:linear-gradient(
        135deg,
        var(--primary),
        #3b82f6
    );

    color:white;

    padding:12px 22px;

    border-radius:14px;

    font-size:15px;
    font-weight:700;

    cursor:pointer;

    transition:0.25s;
}

.nav-btn:hover{

    transform:translateY(-2px);

    background:linear-gradient(
        135deg,
        var(--primary-dark),
        var(--primary)
    );
}

.year{

    font-size:42px;
    font-weight:800;
    min-width:130px;
    text-align:center;
}

/* MAIN */

.container{

    padding:35px;
}

/* GRID */

.calendar-grid{

    display:grid;

    grid-template-columns:
        repeat(auto-fit,minmax(340px,1fr));

    gap:28px;
}

/* CARD */

.month-card{

    background:rgba(255,255,255,0.96);

    backdrop-filter:blur(10px);

    border-radius:26px;

    overflow:hidden;

    box-shadow:
        0 10px 30px rgba(0,0,0,0.22);

    transition:0.3s;
}

.month-card:hover{

    transform:translateY(-6px);

    box-shadow:
        0 18px 40px rgba(0,0,0,0.30);
}

.month-header{

    background:
        linear-gradient(
            135deg,
            #2563eb,
            #1d4ed8
        );

    padding:18px;

    text-align:center;

    font-size:24px;
    font-weight:800;

    color:white;

    letter-spacing:-0.5px;
}

/* WEEK HEADER */

.week-header,
.days-grid{

    display:grid;
    grid-template-columns:repeat(7,1fr);
}

.week-header div{

    text-align:center;

    padding:14px 0;

    background:#f3f4f6;

    color:#374151;

    font-weight:700;

    font-size:14px;

    border-bottom:1px solid var(--border);
}

/* DAY CELL */

.day{

    aspect-ratio:1/1;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:15px;
    font-weight:600;

    color:var(--text);

    border:1px solid #f3f4f6;

    transition:0.2s;

    position:relative;
}

.day:hover{

    background:#eff6ff;
}

.empty{

    background:#fafafa;
}

.sunday{

    color:var(--red);
}

.non-working{

    background:
        linear-gradient(
            135deg,
            #22c55e,
            #16a34a
        );

    color:white;
}

.today{

    background:
        linear-gradient(
            135deg,
            #f59e0b,
            #f97316
        );

    color:white;

    font-weight:800;

    box-shadow:
        inset 0 0 0 2px white;
}

/* LEGEND */

.legend{

    display:flex;
    align-items:center;
    gap:15px;

    margin-top:40px;

    background:rgba(255,255,255,0.08);

    border:1px solid rgba(255,255,255,0.08);

    padding:18px 24px;

    border-radius:18px;

    width:max-content;

    backdrop-filter:blur(15px);
}

.legend-box{

    width:28px;
    height:28px;

    border-radius:8px;

    background:
        linear-gradient(
            135deg,
            #22c55e,
            #16a34a
        );
}

.legend span{

    font-size:15px;
    font-weight:600;
}

/* MOBILE */

@media(max-width:768px){

    .topbar{

        flex-direction:column;
        gap:20px;
        padding:25px;
    }

    .controls{

        width:100%;
        justify-content:center;
    }

    .logo{

        font-size:28px;
    }

    .year{

        font-size:32px;
    }

    .container{

        padding:20px;
    }

    .calendar-grid{

        grid-template-columns:1fr;
    }
}

</style>
</head>

<body>

<div class="topbar">

    <div class="logo">
        Non Working Saturday Calendar
    </div>

    <div class="controls">

        <button class="nav-btn"
            onclick="changeYear(-1)">
            ◀ Previous
        </button>

        <div class="year"
            id="yearTitle">
            2026
        </div>

        <button class="nav-btn"
            onclick="changeYear(1)">
            Next ▶
        </button>

    </div>

</div>

<div class="container">

    <div class="calendar-grid"
        id="calendarGrid">
    </div>

    <div class="legend">

        <div class="legend-box"></div>

        <span>
            Alternate Non-Working Saturdays
        </span>

    </div>

</div>

<script>

let currentYear = 2026;

const months = [

    "January","February","March","April",
    "May","June","July","August",
    "September","October","November","December"
];

function changeYear(step){

    currentYear += step;

    renderCalendar();
}

function isNonWorkingSaturday(
    year,
    month,
    day
){

    const date =
        new Date(year,month,day);

    if(date.getDay() !== 6){
        return false;
    }

    const reference =
        new Date(2026,0,3);

    const diff =
        Math.floor(
            (date - reference) /
            (1000 * 60 * 60 * 24)
        );

    const weeks =
        Math.floor(diff / 7);

    return weeks % 2 === 0;
}

function renderCalendar(){

    document.getElementById(
        "yearTitle"
    ).innerText = currentYear;

    const grid =
        document.getElementById(
            "calendarGrid"
        );

    grid.innerHTML = "";

    for(let month=0; month<12; month++){

        const card =
            document.createElement("div");

        card.className = "month-card";

        // Header
        const header =
            document.createElement("div");

        header.className =
            "month-header";

        header.innerText =
            `${months[month]} ${currentYear}`;

        card.appendChild(header);

        // Week Header
        const weekHeader =
            document.createElement("div");

        weekHeader.className =
            "week-header";

        ["Su","Mo","Tu","We","Th","Fr","Sa"]
            .forEach(day => {

                const el =
                    document.createElement("div");

                el.innerText = day;

                weekHeader.appendChild(el);
            });

        card.appendChild(weekHeader);

        // Days Grid
        const daysGrid =
            document.createElement("div");

        daysGrid.className =
            "days-grid";

        const firstDay =
            new Date(
                currentYear,
                month,
                1
            ).getDay();

        const totalDays =
            new Date(
                currentYear,
                month + 1,
                0
            ).getDate();

        // Empty cells
        for(let i=0; i<firstDay; i++){

            const empty =
                document.createElement("div");

            empty.className =
                "day empty";

            daysGrid.appendChild(empty);
        }

        // Actual days
        for(let day=1; day<=totalDays; day++){

            const cell =
                document.createElement("div");

            cell.className = "day";

            cell.innerText = day;

            const date =
                new Date(
                    currentYear,
                    month,
                    day
                );

            // Sunday
            if(date.getDay() === 0){

                cell.classList.add("sunday");
            }

            // Alternate Saturday
            if(
                isNonWorkingSaturday(
                    currentYear,
                    month,
                    day
                )
            ){

                cell.classList.add(
                    "non-working"
                );
            }

            // Today
            const today =
                new Date();

            if(
                today.getDate() === day &&
                today.getMonth() === month &&
                today.getFullYear() === currentYear
            ){

                cell.classList.add("today");
            }

            daysGrid.appendChild(cell);
        }

        card.appendChild(daysGrid);

        grid.appendChild(card);
    }
}

renderCalendar();

</script>

</body>
</html>
