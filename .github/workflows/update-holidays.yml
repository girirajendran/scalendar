name: Update holiday data

# Regenerates data/holidays.json from the `holidays` library (Tamil Nadu + US)
# and commits it when anything changed. The static site loads that file.
on:
  schedule:
    - cron: "0 3 * * 1"          # every Monday 03:00 UTC
  workflow_dispatch:              # run it by hand from the Actions tab
  push:
    paths:
      - scripts/generate_holidays.py
      - .github/workflows/update-holidays.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install latest holidays library
        run: pip install --upgrade holidays

      - name: Generate data/holidays.json
        run: python scripts/generate_holidays.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898900+github-actions[bot]@users.noreply.github.com"
          git add data/holidays.json
          if git diff --cached --quiet; then
            echo "Holiday data unchanged."
          else
            git commit -m "Update holiday data"
            git push
          fi
