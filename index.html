<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Saturday Calendar</title>
<meta name="description" content="Alternate non-working Saturdays with Tamil Nadu and US public holidays — day, week, month, year and agenda views." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ===== App bar ===== -->
<header class="appbar">
  <div class="appbar-left">
    <button class="icon-btn menu-btn" id="menuBtn" aria-label="Toggle sidebar" title="Toggle sidebar">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      </div>
      <span class="brand-name">Saturday Calendar</span>
    </div>
  </div>

  <div class="search" id="searchBox">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="search" type="search" placeholder="Search holidays" autocomplete="off" aria-label="Search holidays" />
    <kbd>/</kbd>
    <div class="search-results" id="searchResults" role="listbox" hidden></div>
  </div>

  <div class="appbar-right">
    <div class="today-pill" id="todayPill"></div>
  </div>
</header>

<div class="shell">
  <!-- ===== Sidebar ===== -->
  <aside class="sidebar" id="sidebar">
    <section class="side-sec">
      <h3>My calendars</h3>
      <div class="cals" role="group" aria-label="Show on calendar">
        <label class="cal sat"><input type="checkbox" data-key="sat" checked><span class="box"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></span><span class="cal-name">Saturdays off</span><span class="cal-count" id="c-sat"></span></label>
        <label class="cal tn"><input type="checkbox" data-key="tn" checked><span class="box"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></span><span class="cal-name">Tamil Nadu holidays</span><span class="cal-count" id="c-tn"></span></label>
        <label class="cal us"><input type="checkbox" data-key="us" checked><span class="box"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></span><span class="cal-name">US holidays</span><span class="cal-count" id="c-us"></span></label>
      </div>
      <p class="side-note" id="tnNote" hidden></p>
    </section>

    <section class="side-sec">
      <h3>Upcoming</h3>
      <div class="upcoming" id="upcoming"></div>
    </section>
  </aside>
  <div class="scrim" id="scrim"></div>

  <!-- ===== Main ===== -->
  <main class="main">
    <div class="toolbar">
      <div class="tb-left">
        <button class="btn" id="todayBtn" title="Go to today (T)">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M3 10h18M12 14h.01"/></svg>
          Today
        </button>
        <div class="nav-arrows">
          <button class="icon-btn" id="prevBtn" aria-label="Previous" title="Previous (←)"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
          <button class="icon-btn" id="nextBtn" aria-label="Next" title="Next (→)"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button>
        </div>
        <h1 class="range" id="rangeTitle" aria-live="polite"></h1>
      </div>
      <div class="views" role="tablist" aria-label="Calendar view">
        <button role="tab" data-view="month" title="Month (M)">Month</button>
        <button role="tab" data-view="year" title="Year (Y)">Year</button>
        <button role="tab" data-view="agenda" title="Agenda (A)">Agenda</button>
      </div>
    </div>
    <div class="view" id="view"></div>
  </main>
</div>

<div class="pop" id="pop" role="dialog" aria-modal="false" hidden></div>
<div class="tip" id="tip" role="tooltip"></div>

<script src="app.js"></script>
</body>
</html>
